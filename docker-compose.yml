version: '3.8'

services:
  # PostGIS Database Service
  db:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgis
    environment:
      POSTGRES_USER: darukaa_admin
      POSTGRES_PASSWORD: darukaa_secure_password_2026
      POSTGRES_DB: darukaa_earth
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa_admin -d darukaa_earth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    environment:
      DATABASE_URL: postgresql://darukaa_admin:darukaa_secure_password_2026@db:5432/darukaa_earth
      SECRET_KEY: darukaa_earth_super_secret_jwt_key_2026_hackathon_secure!
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always

volumes:
  postgis_data:
